<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hello-vue-app/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>萬豪商務顧問有限公司</title>
    <script type="module" crossorigin src="/hello-vue-app/assets/index-DHA36sDM.js"></script>
    <link rel="stylesheet" crossorigin href="/hello-vue-app/assets/index-BiUV5jmT.css">
  </head>
  <body>
    <div id="app"></div>

    <!-- ★ 在載入 main.ts 之前：把 ?/xxx 還原成真的路徑 -->
    <script>
      (function () {
        var BASE = '/hello-vue-app/'; // 與 vite.config.ts 的 base 一致（保留結尾 /）
        var l = window.location;
        // 只處理 ?/ 開頭的查詢字串
        if (l.search && l.search.indexOf('?/') === 0) {
          var qs = l.search.slice(2).split('&'); // 去掉 "?/"
          var path = qs.shift() || '';           // 第一段是原始 path
          var query = qs.length ? '?' + qs.join('&') : '';
          var newUrl = BASE + path + query + l.hash;

          // 去掉可能的雙斜線（如 path 為空）
          newUrl = newUrl.replace(/\/{2,}/g, '/');

          // 直接把 URL 改回來（不加新紀錄）
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>

    <!-- 你的 Vue app 入口 -->
  </body>
</html>
